# Las pruebas, en cada cambio.
#
# El motor (Rust) y la app (TypeScript) se prueban por separado: el motor
# es el que se compara con el original, y la app es la que se usa.
name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  comprobaciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: taiki-e/install-action@v2
        with:
          tool: bun

      - name: Las pruebas del motor
        run: cargo test --workspace

      - name: Las pruebas de la app
        working-directory: crates/genmsi-app
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run typecheck
