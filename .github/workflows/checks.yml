# The tests, on every change.
#
# The engine (Rust) and the app (TypeScript) are tested separately: the
# engine is the one that is compared with the original, and the app is the
# one that is used.
#
# The desktop shell has its own job: the workspace excludes it, so nothing
# compiled it in the CI.
name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A weekly run on the image that `ubuntu-latest` points to. The label
  # migrates with notice (the next one was announced for October 2026), and
  # this job is how the project finds out on a Monday, instead of finding out
  # on a Tuesday push that nothing in the repository changed.
  schedule:
    - cron: "23 6 * * 1"

jobs:
  comprobaciones:
    # The image is pinned: the pushes run on a known base, and only the
    # weekly run follows `ubuntu-latest` to the image it points to.
    runs-on: ${{ github.event_name == 'schedule' && 'ubuntu-latest' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      # Bun: the binary that publishes Bun (the one of crates.io is another
      # crate, and it does not compile with a stable rustc).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: The tests of the engine
        run: cargo test --workspace

      - name: The tests of the app
        working-directory: crates/genmsi-app
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run typecheck

  # The desktop shell: the crate that the workspace excludes, so it was never
  # compiled in the CI. Here it is compiled and tested.
  shell:
    name: El shell de escritorio
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates/genmsi-app/src-tauri -> target"

      # The libraries the shell needs on Ubuntu: GTK 3 and WebKitGTK 4.1.
      - name: The libraries of the shell
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # Bun: the binary that publishes Bun (the one of crates.io is another
      # crate, and it does not compile with a stable rustc).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The frontend: the shell carries it inside, so it has to exist before
      # the shell is compiled.
      - name: The frontend of the app
        working-directory: crates/genmsi-app
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: The tests of the shell
        working-directory: crates/genmsi-app/src-tauri
        run: cargo test

  # The commits: who signs them and what they say.
  #
  # The rule of the project: no commit carries an attribution footer (no
  # `Co-Authored-By`, no `Signed-off-by`), and the only author is the owner of
  # the repository. It is written down in `AGENTS.md`; this job is what makes
  # it true, because a rule that is not checked is a wish.
  atribucion:
    name: La atribución de los commits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the rule is about every commit, not about the
          # last one.
          fetch-depth: 0

      - name: Ningún commit lleva pie de atribución
        run: |
          if git log --format=%B | grep -inE '^[[:space:]]*(co-authored-by|signed-off-by):'; then
            echo "::error::un commit lleva pie de atribución (Co-Authored-By o Signed-off-by)"
            exit 1
          fi

      - name: Solo el dueño firma los commits
        run: |
          otros="$(git log --format='%an <%ae>' | sort -u \
            | grep -vFx 'Lucas Cardozo <lucasivancardozo27@gmail.com>' || true)"
          if [ -n "$otros" ]; then
            echo "::error::commits que no son del dueño del repositorio:"
            echo "$otros"
            exit 1
          fi
