# Los instaladores de los tres sistemas.
#
# Tauri arma el instalador del sistema en el que corre: el `.deb` y el
# `.rpm` en Linux, el `.msi` y el `.exe` en Windows, el `.dmg` en macOS.
# Por eso el trabajo está en la matriz: un runner por sistema, y los
# instaladores de la misma versión en todos.
#
# El release se abre como borrador: lo publica quien decide que la versión
# está para publicar.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "La etiqueta del release (v0.3.0)"
        required: true
        default: "v0.3.0"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux
            args: ""
          - platform: macos-latest
            name: macos
            args: ""
          - platform: windows-latest
            name: windows
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates/genmsi-app/src-tauri -> target"

      - name: Las dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Las dependencias de macOS
        if: matrix.platform == 'macos-latest'
        run: brew install create-dmg

      # Bun: el binario que publica Bun (el de crates.io es otro crate, y
      # no compila con un rustc estable).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Las dependencias del frontend
        working-directory: crates/genmsi-app
        run: bun install --frozen-lockfile

      - name: El bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/genmsi-app
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "GenMSI ${{ inputs.tag || github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # The package of pacman: the one format Tauri does not make, and the one
  # CachyOS needs (it is an Arch distribution).
  #
  # It is built inside a container of Arch, because `makepkg` is of Arch.
  pacman:
    name: El paquete de pacman (CachyOS)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Las dependencias
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            rust \
            cargo \
            webkit2gtk-4.1 \
            gtk3 \
            patchelf \
            git
          # Bun: its own release (the crate of crates.io is another
          # program), installed for everybody and not for one user.
          BUN_INSTALL=/usr/local bash -c "curl -fsSL https://bun.sh/install | bash"

      - name: El paquete
        run: |
          # makepkg no corre como root.
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && PATH=/usr/local/bin:\$PATH packaging/arch/build-package.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: genmsi-pacman
          path: target/arch-package/*.pkg.tar.zst

  # The package of pacman joins the release, next to the other installers.
  publicar-pacman:
    name: El paquete de pacman, en el release
    needs: [release, pacman]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: genmsi-pacman
          path: paquete

      - name: Al release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" paquete/*.pkg.tar.zst --clobber --repo "$GITHUB_REPOSITORY"
