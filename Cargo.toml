[workspace]
resolver = "2"
members = [
    "crates/genmsi-format",
    "crates/genmsi-core",
    "crates/genmsi-cli",
    "crates/genmsi-mcp",
    "crates/genmsi-app/engine",
]
# genmsi-app (Tauri 2 + React) joins the workspace in Phase 4.
# The desktop shell (crates/genmsi-app/src-tauri) stays out: its dependency
# tree is heavy and the workspace's build must not slow down.
exclude = ["crates/genmsi-app/src-tauri"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT"
authors = ["Lucas Cardozo"]
repository = "https://github.com/LucasIvanCardozo/genmsi"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
roxmltree = "0.20"
# The JSON schema of the editing commands: the MCP derives the schema of its
# tools from the engine's own types, so the vocabulary of the commands is
# defined in one place. The version is the one rmcp uses, so the derive and
# the trait are the same one.
schemars = "1"

[profile.release]
lto = "thin"
strip = true
