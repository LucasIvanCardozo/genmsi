[package]
name = "genmsi-cli"
description = "Command-line client for the GenMSI engine: simulate, lint, trace (human and --json output)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "genmsi"
path = "src/main.rs"

[dependencies]
genmsi-core = { path = "../genmsi-core" }
