[package]
name = "genmsi-format"
description = "Reading, validation and writing of GenMSI .gmdl model files and gClasses.xml block definitions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
roxmltree.workspace = true
# The TypeScript types of the editing commands are generated from these types,
# the same way genmsi-core publishes its documents. The feature is optional so
# the default build does not carry the generator.
ts-rs = { version = "12", optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
serde_json.workspace = true
