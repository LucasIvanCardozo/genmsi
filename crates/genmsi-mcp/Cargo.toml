[package]
name = "genmsi-mcp"
description = "MCP server exposing the GenMSI engine to AI agents over stdio (tools: simulate, lint, get_trace, explain_model)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "genmsi_mcp"
path = "src/lib.rs"

[[bin]]
name = "genmsi-mcp"
path = "src/main.rs"

[dependencies]
genmsi-core = { path = "../genmsi-core" }
genmsi-format = { path = "../genmsi-format" }
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
insta = "1"
rmcp = { version = "3", features = ["client"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
